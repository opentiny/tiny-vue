name: Dispatch Alpha Ui Publish
run-name: Dispatch Alpha Ui--${{ inputs.components }}

on:
  workflow_dispatch:
    inputs:
      components:
        description: |
          输入需要打包的组件名称，多个以空格分隔,
          例如： `input alert`.
        required: false
        type: string
      updateVersion:
        description: '是否自动升级 patch 版本号'
        required: false
        type: boolean
        default: true
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: CheckOut Code
        uses: actions/checkout@master
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.10.0
          registry-url: 'https://registry.npmjs.org'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm i --no-frozen-lockfile

      - name: Run Build Components
        if: inputs.components != ''
        run: pnpm build:ui ${{ inputs.components }}

      - name: Run Build All Components
        if: inputs.components == ''
        run: pnpm build:ui

      - name: Run Release alpha
        shell: bash
        run: |
          # 根据工作流输入决定是否自动升级 patch 版本号（使用 bash 语法）
          if [ "${{ inputs.updateVersion }}" = "true" ]; then
            pnpm release:alpha -u   # 自动升级 patch 版本
          else
            pnpm release:alpha      # 不升级版本
          fi

      # Keep the build runtime; pnpm publish delegates the upload to npm on PATH.
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm supports trusted publishing
        run: node -e "const v=require('child_process').execSync('npm --version',{encoding:'utf8'}).trim(); const [a,b,c]=v.split('.').map(Number); if(a<11||(a===11&&(b<5||(b===5&&c<1)))) throw new Error('npm >=11.5.1 required, found '+v); console.log('npm '+v)"

      - name: Publish
        run: |
          pnpm pub:all
